<header class="barra">
  <div class="wrap barra-in">
    <div class="marca">
      <span class="material-icons" aria-hidden="true">fitness_center</span>
      <span>Beast Mode</span>
    </div>

    <nav class="tabs" aria-label="Secciones">
      @for (p of pestanas(); track p.ruta) {
        <a
          [routerLink]="p.ruta"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: !!p.exacta }"
          [attr.aria-current]="rla.isActive ? 'page' : null"
        >
          <span class="material-icons" aria-hidden="true">{{ p.icono }}</span>
          {{ p.etiqueta }}
        </a>
      }
    </nav>

    @if (auth.usuario(); as usuario) {
      <div class="usuario">
        <div class="usuario-txt">
          <strong>{{ usuario.nombre }}</strong>
          <span>{{ nombreRol() }}</span>
        </div>
        <button class="salir" type="button" (click)="salir()" aria-label="Cerrar sesión" title="Cerrar sesión">
          <span class="material-icons" aria-hidden="true">logout</span>
        </button>
      </div>
    }
  </div>
</header>

<main class="wrap contenido">
  <router-outlet />
</main>
