<div class="login-wrap">
  <div class="grid-overlay"></div>

  <mat-card class="login-card">
    <div class="marca-header">
      <div class="logo">
        <div class="logo-ring"></div>
        <mat-icon class="logo-icon">fitness_center</mat-icon>
      </div>
      <h1 class="marca">BEAST MODE</h1>
    </div>

    <form (ngSubmit)="enviar()" #f="ngForm">
      <mat-card-content>
        <div class="campo-grupo" style="animation-delay: 0.1s">
          <label for="email">Correo</label>
          <div class="input-pill">
            <mat-icon>mail</mat-icon>
            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              required
              autocomplete="username"
              autofocus
            />
          </div>
        </div>

        <div class="campo-grupo" style="animation-delay: 0.16s">
          <label for="password">Contraseña</label>
          <div class="input-pill">
            <mat-icon>lock</mat-icon>
            <input
              id="password"
              [type]="mostrarPassword() ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              required
              autocomplete="current-password"
            />
            <button
              mat-icon-button
              type="button"
              class="boton-ojo"
              (click)="alternarMostrarPassword()"
              [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              tabindex="-1"
            >
              <mat-icon>{{ mostrarPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
        </div>

        @if (error()) {
          <p class="error">
            <mat-icon>error_outline</mat-icon>
            <span>{{ error() }}</span>
          </p>
        }
      </mat-card-content>

      <mat-card-actions>
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="f.invalid || cargando()"
          class="boton-entrar"
          style="animation-delay: 0.22s"
        >
          @if (cargando()) {
            <mat-spinner diameter="20" />
          } @else {
            <span class="boton-contenido">
              ENTRAR
              <mat-icon>arrow_forward</mat-icon>
            </span>
          }
        </button>

        <button
          mat-stroked-button
          type="button"
          [disabled]="f.invalid || cargando()"
          class="boton-checkin"
          (click)="entrarYChequear()"
          style="animation-delay: 0.28s"
        >
          <span class="boton-contenido">
            <mat-icon>qr_code_scanner</mat-icon>
            Solo check-in
          </span>
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
