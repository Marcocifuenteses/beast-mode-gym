<div class="login-wrap">
  <form class="panel login" (ngSubmit)="enviar()" #f="ngForm">
    <div class="marca">
      <span class="material-icons" aria-hidden="true">fitness_center</span>
      <h1>Beast Mode</h1>
    </div>
    <p class="note centro">Control del gimnasio · inicia sesión para continuar</p>

    <label class="campo" for="email">
      <span class="label">Correo</span>
      <input
        id="email"
        class="input"
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        autocomplete="username"
        autofocus
      />
    </label>

    <label class="campo" for="password">
      <span class="label">Contraseña</span>
      <span class="con-ojo">
        <input
          id="password"
          class="input"
          [type]="mostrarPassword() ? 'text' : 'password'"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />
        <button
          type="button"
          class="ojo"
          (click)="alternarMostrarPassword()"
          [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          <span class="material-icons" aria-hidden="true">{{ mostrarPassword() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </span>
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button class="btn" type="submit" [disabled]="f.invalid || cargando()">
      {{ cargando() ? 'Entrando…' : 'Entrar' }}
    </button>
    <button class="btn ghost" type="button" [disabled]="f.invalid || cargando()" (click)="entrarYChequear()">
      <span class="material-icons" aria-hidden="true">qr_code_scanner</span>
      Entrar directo al check-in
    </button>
  </form>
</div>
