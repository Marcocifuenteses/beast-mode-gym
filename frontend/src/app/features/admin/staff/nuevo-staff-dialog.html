<h2 mat-dialog-title>Nueva cuenta de personal</h2>

<form (ngSubmit)="guardar()" #f="ngForm">
  <mat-dialog-content class="campos">
    <mat-form-field appearance="outline" class="campo">
      <mat-label>Nombre</mat-label>
      <input matInput name="nombre" [(ngModel)]="nombre" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo">
      <mat-label>Apellido</mat-label>
      <input matInput name="apellido" [(ngModel)]="apellido" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo">
      <mat-label>Correo</mat-label>
      <input matInput type="email" name="email" [(ngModel)]="email" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" name="password" [(ngModel)]="password" required minlength="6" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo">
      <mat-label>Rol</mat-label>
      <mat-select name="rol" [(ngModel)]="rol" required>
        <mat-option value="ENTRENADOR">Entrenador</mat-option>
        <mat-option value="ADMIN">Administrador</mat-option>
      </mat-select>
    </mat-form-field>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="f.invalid || guardando()">Crear</button>
  </mat-dialog-actions>
</form>
