<div class="encabezado">
  <div class="page-header">
    <div class="page-header-icon"><mat-icon>badge</mat-icon></div>
    <div>
      <h1>Personal</h1>
      <p>Cuentas de administradores y entrenadores</p>
    </div>
  </div>
  <button mat-flat-button color="primary" (click)="abrirNuevo()">
    <mat-icon>person_add</mat-icon>
    Nueva cuenta
  </button>
</div>

<div class="tabla-wrap">
<table mat-table [dataSource]="staff()" class="tabla">
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let u">{{ u.nombre }} {{ u.apellido }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Correo</th>
    <td mat-cell *matCellDef="let u">{{ u.email }}</td>
  </ng-container>

  <ng-container matColumnDef="rol">
    <th mat-header-cell *matHeaderCellDef>Rol</th>
    <td mat-cell *matCellDef="let u">
      <span class="chip" [class.admin]="u.rol === 'ADMIN'">{{ u.rol }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let u">
      <button
        mat-icon-button
        color="warn"
        [disabled]="esUnoMismo(u)"
        [title]="esUnoMismo(u) ? 'No puedes desactivar tu propia cuenta' : 'Desactivar'"
        (click)="desactivar(u)"
      >
        <mat-icon>person_off</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>
</div>

@if (!cargando() && staff().length === 0) {
  <p class="vacio">No hay cuentas de personal.</p>
}
