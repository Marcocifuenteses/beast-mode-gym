<h2 mat-dialog-title>Asignar plan</h2>

<form (ngSubmit)="guardar()" #f="ngForm">
  <mat-dialog-content class="campos">
    <p>Cliente: <strong>{{ data.nombreCliente }}</strong></p>

    <mat-form-field appearance="outline" class="campo">
      <mat-label>Plan</mat-label>
      <mat-select name="planId" [(ngModel)]="planId" required>
        @for (plan of planes(); track plan.id) {
          <mat-option [value]="plan.id">{{ plan.nombre }} — Q{{ plan.precio }} ({{ plan.duracionDias }} días)</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo">
      <mat-label>Método de pago</mat-label>
      <mat-select name="metodoPago" [(ngModel)]="metodoPago" required>
        <mat-option value="EFECTIVO">Efectivo</mat-option>
        <mat-option value="TRANSFERENCIA">Transferencia</mat-option>
      </mat-select>
    </mat-form-field>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="f.invalid || guardando()">Asignar</button>
  </mat-dialog-actions>
</form>
