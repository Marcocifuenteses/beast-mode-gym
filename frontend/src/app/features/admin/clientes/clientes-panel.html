<div class="page">
  <div class="page-head">
    <div>
      <h1>Socios</h1>
      <p class="note">Toca un socio para ver su ficha, registrar entrada o renovar.</p>
    </div>
    <button class="btn" type="button" (click)="abrirNuevoCliente()">
      <span class="material-icons" aria-hidden="true">person_add</span>
      Nuevo socio
    </button>
  </div>

  <input
    class="input"
    type="search"
    placeholder="Buscar por nombre, código o correo"
    aria-label="Buscar socio"
    [value]="busqueda()"
    (input)="buscar($event)"
  />

  <div class="chips" role="group" aria-label="Filtrar socios">
    @for (f of filtros; track f.clave) {
      <button type="button" [attr.aria-pressed]="filtro() === f.clave" (click)="filtro.set(f.clave)">
        {{ f.etiqueta }} <span class="num cuenta">{{ conteos()[f.clave] }}</span>
      </button>
    }
  </div>

  @if (cargando()) {
    <div class="empty">Cargando socios…</div>
  } @else if (error()) {
    <div class="empty">No se pudo cargar la lista. <button class="btn sm ghost" (click)="cargar()">Reintentar</button></div>
  } @else {
    <div class="list">
      @for (c of visibles(); track c.clienteId) {
        <button class="row" type="button" (click)="abrirFicha(c)">
          <span class="av">{{ iniciales(c.nombre, c.apellido) }}</span>
          <span class="who">
            <strong>{{ c.nombre }} {{ c.apellido }}</strong>
            <span>
              <span class="num">{{ c.codigo }}</span> ·
              @if (c.plan && c.fechaFin) {
                {{ c.plan }} · vence {{ fechaCorta(c.fechaFin) }}
              } @else {
                Sin plan asignado
              }
            </span>
          </span>
          @if (c.dentro) {
            <span class="pill in">Dentro</span>
          } @else {
            @let e = estadoMembresia(c);
            <span class="pill" [class]="e.clase">{{ e.texto }}</span>
          }
        </button>
      } @empty {
        <div class="empty">No hay socios con ese filtro.</div>
      }
    </div>
  }
</div>
